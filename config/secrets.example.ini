; Copie este arquivo para config/secrets.ini (ignorado pelo Git) ou informe
; as credenciais no aplicativo, com a opção de lembrar credenciais ativada.
[login]
username = you@example.com
password = your-password

; Opcional: notificações no Telegram. Crie um bot com @BotFather,
; envie uma mensagem para ele e consulte o chat_id em
; https://api.telegram.org/bot<TOKEN>/getUpdates
[telegram]
bot_token = 123456789:AAExampleTokenFromBotFather
chat_id = 123456789

; Opcional: painel web acessível na rede local (celular, tablet).
; Configure [web] host = 0.0.0.0 em settings.ini e defina um token aleatório longo.
; Acesse http://<ip-do-servidor>:8744/?token=<token> em cada dispositivo.
[web]
token = change-me-to-a-long-random-string
