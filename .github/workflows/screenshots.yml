name: Atualizar capturas AM/04

on:
  push:
    branches:
      - docs/refresh-am04-screenshots
      - feat/selecionar-modelo-compra-automatica
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependências de interface virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk

      - name: Dependências Python
        run: python -m pip install -r requirements.txt pillow

      - name: Browser instalado
        run: |
          google-chrome --version || chromium --version || chromium-browser --version
          command -v Xvfb
          python -c "import tkinter, PIL, selenium, customtkinter; print('Dependências prontas')"

      - name: Capturar interface real com dados demonstrativos
        run: xvfb-run -a -s "-screen 0 1920x1200x24" python scripts/screenshots.py

      - name: Verificar arquivos, dimensões e integridade
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from PIL import Image

          root = Path("screenshots")
          script = ast.parse(Path("scripts/screenshots.py").read_text(encoding="utf-8"))
          names = next(ast.literal_eval(n.value) for n in script.body
                       if isinstance(n, ast.Assign) and any(
                           isinstance(t, ast.Name) and t.id == "GENERATED" for t in n.targets
                       ))
          actual = sorted(p.name for p in root.glob("*.png"))
          assert actual == sorted(names), (actual, names)
          for name in names:
              path = root / name
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  w, h = image.size
                  assert w >= 400 and h >= 700, (name, w, h)
                  print(f"{name}: {w}x{h} ({path.stat().st_size} bytes)")
          PY

      - name: Publicar capturas na branch de documentação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "Capturas já estão atualizadas."
          else
            git commit -m "docs: regenerar screenshots da interface AM/04 compacta"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
